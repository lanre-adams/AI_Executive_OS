[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-eos"
version = "0.1.0"
description = "AI Executive Operating System - a Chief of Staff agent coordinating a team of specialist AI agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Olanrewaju Adams Agunloye" }]
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "redis>=5.0",
  "qdrant-client>=1.10",
  "langgraph>=0.2",
  "httpx>=0.27",
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4.1",
  "cryptography>=42",
  "typer>=0.12",
  "rich>=13",
  "prometheus-client>=0.20",
  "pypdf>=4.2",
  "python-multipart>=0.0.9",
  "email-validator>=2.1",
]

[project.optional-dependencies]
analytics = ["pandas>=2.2", "numpy>=1.26", "matplotlib>=3.8", "openpyxl>=3.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
eos = "ai_eos.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_eos = ["agents/prompts/*.md", "web/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["ai_eos"]
branch = false
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "S105", "S106", "S108"]
"src/ai_eos/config.py" = ["S105"]  # env-var *names*, not secrets

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
